<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스폰지밥소개 애니</title>
    <!-- 스폰지밥 메인 CSS -->
    <link rel="stylesheet" href="./css/spongebob.css">
    <!-- 스폰지밥 애니메이션 CSS -->
    <link rel="stylesheet" href="./css/spongebob_ani.css">
</head>

<body>
    <h1 class="tit">SpongeBob's Characters</h1>

    <!-- 전체화면박스 -->
    <div class="house rbx">
        <!-- 1.스폰지밥 -->
        <img src="./images/spongebob.png" alt="스폰지밥" class="spongebob">

        <!-- 2.문짝 -->
        <img src="./images/door.png" alt="문짝" class="door">

        <!-- 3.말풍선 -->
        <div class="words">
            Hi! Everyone <br>
            My Name is SpongeBob! <br>
            This is My House. <br>
            It's Fantastic! <br>
            I LOVE MY Friends!!!
        </div>

        <!-- 4.징징이 -->
        <img src="./images/gingging.png" alt="징징이" class="gingging">

        <!-- 5.리사 -->
        <img src="./images/Lisa_Simpson.png" alt="리사스폰지밥" class="lisa">

        <!-- 6.메기 -->
        <img src="./images/Maggie_Simpson.png" alt="메기스폰지밥" class="maggie">

        <!-- 7.바트 -->
        <img src="./images/Bart_Simpson.png" alt="바트스폰지밥" class="bart">

    </div><!-- .house -->

    <!-- TV이미지 -->
    <img src="./images/oldTVnew.png" alt="TV" id="tv">

</body></html>

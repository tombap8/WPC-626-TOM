<!DOCTYPE html>
<html lang="en">
<head>

    <title>Rolling Cube 3D Animation</title>
    <!-- 외부 CSS -->
    <link rel="stylesheet" href="./css/cube.css">
    <!-- 외부 JS -->
    <!-- <script src="./js/cube.js" defer></script> -->
</head>
<body>
    <!-- 작동버튼 -->
    <!-- <button class="btngo">돌아!</button> -->

    <!-- 큐브 : 정육면체 -->
    <div class="cube rotate-cube" onmouseover="
    document.querySelector('.shadow').style.animationPlayState='paused';
    " onmouseout="document.querySelector('.shadow').style.animationPlayState='running';">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- 큐브 그림자 연출용 박스 -->
    <div class="shadow"></div>
</body>
</html>

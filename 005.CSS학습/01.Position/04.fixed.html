<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>04. fixed 포지션</title>
    <style>
      .bx {
        width: 300px;
        height: 300px;
        border: 2px solid blue;
        text-align: center;
        font-size: 24px;
        font-weight: bold; /* fwb */
        /* 글자세로중앙 */
        line-height: 300px;
      }

      /* 첫번째 픽스드 박스 */
      #f1 {
        position: fixed;

        /* 화면정중앙배치하기 */
        top: 50%;
        left: 50%;
        /* 중앙이동 translate */
        translate: -50% -50%;

        /* 위치올리기 z-index */
        z-index: 999;

        /******************************** 
        [ 4. fixed 포지션 ] 

        1. 보이는 화면을 기준한 포지션이다!
        -> 대부분의 속성은 absolute와 같으나
        부모만 다르다고 보면 된다!

        2. 스크롤이 내려갈때 요소가 그대로 화면에 멈춰있다!

        3. 위치속성값을 설정하지 않으면 젠틀하다!
        -> 젠틀픽스드!!! (젠틀앱솔루트와 같음!)

        4. 크기설정을 하지 않으면 내용만큼 자동크기설정됨!
        -> 픽스드 판타롱스타킹!!! (앱솔루트와 같음)

        5. 인라인요소도 fixed를 주면 block으로 자동전환됨!

        6. 부모요소가 아무리 많이 싸여있어도 
        fixed를 주면 화면을 기준하여 위치를 잡는다!

        7. 이미 부모가 fixed이면 자손요소는 fixed를 
        할 필요가 없다!

        8. 활용도
        1) 스크롤에 관계없이 화면고정시
        2) 화면바깥에 숨겼다가 나타나기를 할때
        3) 보이는 화면을 기준하는 구현의 모든경우

        (유의: 배경고정과는 다르다! 배경고정은
        보이는 화면을 기준한 박스의 배경이미지를
        고정해 주는 것! 박스가 움직이면 배경이미지도
        안보이게됨! 반명  fixed포지션은 요소를 고정함!)

          
      ********************************/

        height: 500px;

        background: url(./images/capma.png) no-repeat center/cover;
      }
      /* 두번째 앱솔루트 박스 
      -> 위치값을 주면 부모를 찾음
      -> 싸고 있는 모든 요소가 부모자격이 없으면
      스크롤 상단 보이는 화면이 부모가 된다!
      */
      #a2 {
        position: absolute;
        width: 650px;
        /* 오른쪽 아래 0 위치 부모는? 보이는 화면 */
        right: 0;
        bottom: 0;

        background: url(./images/superman.png) no-repeat center/cover;
      }

      #r1 {
        /* 포지션 relative : por */
        position: relative;

        /* 위로부터 100px : t100 */
        top: 100px;

        /* 왼쪽으로부터 100px : l100 */
        left: 100px;

        background: url(./images/ab5.jpg) no-repeat center/cover;
      }

      
      /* 두번째 픽스드 박스 */
      #f2 {
        position: fixed;
        /* 젠틀픽스드!
        원래있던위치에서 화면고정! */
        z-index: 1;

        background: url(./images/ab4.jpg) no-repeat center/cover;
      }

      /* 첫번째 박스에 포지션 체크 */
      #s1 {
        background-color: lightgreen;
      }
      #s2 {
        background-color: lightcoral;
      }

      /* 제목넣기 : 픽스드로! */
      h1.tit {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 9999;


        text-align: center;
        margin: 0;
        padding: 20px;
        border: 4px solid darkgreen;
        /* [ 둥근모서리 여러값 셋팅하기 ] 
          border-radius: 값 값 값 값;(왼위 오른위 오른아래 왼아래)
          border-radius: 값 값 값;(왼위 오른위대각선 오른아래)
          border-radius: 값 값;(왼위대각선 오른위대각선)
          border-radius: 값;(모든모서리)
        */

        border-radius: 0 0 50% 50%;
        background-color: lightgreen;
        box-shadow: 5px 5px 5px #0000006b;
        font-size: 45px;
      }

      /* 부모를 찾는 앱솔루트! */
      .bx2 {
        border: 2px dotted orangered;
        padding: 50px;
        font-size: 24px;
        text-align: center;
      }
      /* 각 부모박스 */
      .s5 {
        position: relative;
        background-color: lightblue;
      }
      .s6 {
        position: relative;
        background-color: lightcoral;
      }
      .s7 {
        position: relative;
        background-color: lightgreen;
      }
      .s8 {
        position: relative;
        background-color: lightsalmon;
      }

      /* 부모를 찾는 앱솔루트 박스 */
      .abs {
        position: absolute;
        width: 100px;
        height: 50px;
        color: #fff;
        background: url(./images/car.png) no-repeat center/contain;
      }

      /* .a4는 위치이동값을 사용하자! -> 부모찾아 삼만리! */
      .a4 {
        /* 앱솔루트는 .abs에서 이미 셋팅! */
        top: 0;
        left: 0;
        /* 나의 부모는? 포지션이 있는 요소! .s8 */

        /* 앱솔루트 요소 크기를 %로 줄경우
            부모자격 박스를 기준하여 설정된다!!! */
        width: 25%;
        height: 40%;

        /* 보더 */
        border: 10px dotted darkblue;
      }

      /* span 을 픽스드로 만들경우! */
      .span-fixed {
        /* 포지션 픽스드 pof */
        position: fixed;
        bottom: 35%;
        right: 0;
        /* 나의 부모는? 보이는화면(빛이나오는화면) */
        z-index: 1;

        font-size: 40px;
        font-weight: bold;
        color: #fff;
        padding: 20px;
        background-color: magenta;

        /* 아웃라인 ol */
        outline: 4px dotted darkmagenta;
      }

      /* 포스터 미리보기 : 픽스드 포지션 이용!!! */
      .poster-fixed {
        position: fixed;
        top: 20%;
        right: 10%;
        /* 부모는? 픽스드 보이는화면! */

        /* 맨위로! */
        z-index: 9999999;

        /* 보더 */
        border: 10px ridge goldenrod;
      }
      /* 포스터보기 타이틀 */
      .poster-fixed h3{
        /* 앱솔루트 포지션 */
        position: absolute;
        /* 위치값 사용시 부모는? .poster-fixed */
        /* 보더크기는 앱솔루트에서 제외되므로 보더크기만큼 -10px */
        top: -10px;
        /* 오른쪽기준선으로부터 밀기
        부모박스 보더제외한 내부크기100% + 한쪽보더10px */
        right: calc(100% + 10px);

        /* 기본마진 없앰 */
        margin: 0;
        /* color: white; */
        /* 글자중앙정렬은 글자 wrighting-mode에서 진행되는
        글자방향의 중앙을 뜻함! */
        text-align: center;
        /* 높이값 = 부모100% + 위아래보더값20px */
        height: calc(100% + 20px);
        /* 글자배치 세로방향 &  진행방향left -> right */
        writing-mode: vertical-lr;
        letter-spacing: 30px;
        font-size: 24px;
        color: lightgreen;
        text-shadow: 2px 2px 2px #00000070;
        padding: 0 10px;
        background-color: goldenrod;
        border-radius: 10px 0 0 10px;
      }

      /* 이미지가 박스에 단독으로 들어갈 경우
      하단에 생기는 공백 없애기 */
      .poster-fixed img {
        vertical-align: middle;
        /* 인라인요소가 세로정렬 속성인 vertical-align의
        값을 top/middle/bottom 중 어떤값을 사용해도
        하단공백을 없애는 효과가 있다!
        (단,baseline값 효과없음) */
      }

      /* 앱솔루트끼리는 서로 겹친다! */
      .absolute-images {
        width: 300px;
        height: 400px;
        /* 보더액자 */
        border: 50px ridge silver;
      }
      /* 이미지가 앱솔루트! */
      .absolute-images img {
        /* 앱솔루트 포지션 poa */
        position: absolute;
        /* 젠틀앱솔루트!!! */

        width: 300px;
        height: 400px;
      }
      /* 두번째 이미지 투명하게 셋팅 */
      .absolute-images img:last-child {
        opacity: 0;
        /* 트랜지션 trs */
        transition: 0.3s;
      }
      /* 싸고있는 박스에 마우스 오버시 투명도1 */      
      .absolute-images:hover img:last-child {
        opacity: 1;
      }

      /* 앱솔루트 위치값으로 크기만들기 */
      .car-box{
        position: absolute;
        /* 맨위 왼쪽에 위치 */
        top: 0;
        left: 0;
        /* 부모는? 보이는화면! */

        /* 가로크기 - 부모의 25% */
        width: 25%;

        /* 보더 */
        border: 4px dashed darkblue;
        border-radius: 20px;
      }

      /* 자동차 이미지 */
      .car-box img{
        width: 100%;
        /* 이미지는 한쪽 크기만 주면
        나머지 방향크기는 자동비율유지함! */
      }

      /* 자동차 앱솔루트 타이틀박스 */
      .car-box h3{
        position: absolute;
        /* 위치값으로 부모가로크기를 채우게함!
        동적크기 생성! */
        left: 0;
        right: 0;

        bottom: 0;
        /* 부모는? .car-box */
        border: 1px solid red;

        /* 글자중앙정렬 tac */
        text-align: center;

        /* 기본마진없애기 */
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- 제목 -->
    <h1 class="tit">Fixed 포지션</h1>

    <div class="bx" id="r1">r1</div>
    <div class="bx" id="s1">s1</div>

    <!-- 첫번째 픽스드 박스 -->
    <div class="bx" id="f1">f1</div>

    <!-- 두번째 픽스드 박스 : 젠틀픽스드! -->
    <div class="bx" id="f2">f2</div>

    <div class="bx" id="s2">s2</div>

    <!-- 두번째 앱솔루트 박스 -->
    <div class="bx" id="a2">a2</div>

    <!-- 픽스드로 포스터 미리보기 -->
    <div class="poster-fixed" title="픽스드로 포스터 미리보기">
      <img src="./images/ab0.jpg" alt="포스터" />
      <!-- 포스터보기 타이틀 박스 -->
       <h3>포스터보기</h3>
    </div>

    <!-- 앱솔루트끼리는 서로 겹친다! -->
    <div class="absolute-images">
      <img src="./images/ab3.jpg" alt="토르" />
      <img src="./images/ab4.jpg" alt="닥스" />
    </div>

    <!-- 앱솔루트 위치값으로 크기만들기 -->
     <div class="car-box">
      <img src="./images/car.png" alt="자동차">
      <!-- 위치값으로 크기만들 타이틀박스 -->
       <h3>😎레드 스포츠카!!!🚗</h3>
     </div>

    <!-- 부모를 찾는 앱솔루트! -->
    <div class="bx2 s5">
      s5
      <div class="bx2 s6">
        s6
        <div class="bx2 s7">
          s7
          <div class="bx2 s8">
            s8
            <!-- 박스내부 앱솔루트 -->
            <div class="abs a3" title="나는 젠틀앱솔루트다!">a3</div>

            <div class="abs a4" title="나는 부모찾아 올라간다!">a4</div>

            <span class="span-fixed" title="자동블록전환!">
              나는 span 픽스드다!
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

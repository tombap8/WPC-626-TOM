<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03. absolute 포지션</title>
    <style>
      .bx {
        width: 300px;
        height: 300px;
        border: 2px solid blue;
        text-align: center;
        font-size: 24px;
        font-weight: bold; /* fwb */
        /* 글자세로중앙 */
        line-height: 300px;
      }

      /* 첫번째 앱솔루트 박스 */
      #a1{
        position: absolute;

        background: url(./images/ab1.jpg) no-repeat center/cover;
      }
      /* 두번째 앱솔루트 박스 */
      #a2{
        position: absolute;

        background: url(./images/ab1.jpg) no-repeat center/cover;
      }

      #r1 {
        /* 포지션 relative : por */
        position: relative;

        /* 위로부터 100px : t100 */
        top: 100px;

        /* 왼쪽으로부터 100px : l100 */
        left: 100px;

        background: url(./images/ab5.jpg) no-repeat center/cover;
      }
      #r2 {
        /* 포지션 relative */

        background: url(./images/ab4.jpg) no-repeat center/cover;
      }

      /* 첫번째 박스에 포지션 체크 */
      #s1 {
        background-color: lightgreen;
      }
      #s2 {
        background-color: lightcoral;
      }

      /* 제목넣기 : 렐러티브로! */
      h1.tit {
        position: relative;
        left: 30%;
        width: 40%;
        text-align: center;
        margin: 0;
        padding: 20px;
        border: 4px solid darkorange;
        border-radius: 20px;
        background-color: lightsalmon;
        box-shadow: 5px 5px 5px #0000006b;
        font-size: 45px;
      }
    </style>
  </head>
  <body>
    <!-- 제목 -->
    <h1 class="tit">Absolute 포지션</h1>

    <div class="bx" id="r1">r1</div>
    <div class="bx" id="s1">s1</div>

    <!-- 첫번째 앱솔루트 박스 -->
    <div class="bx" id="a1">a1</div>
    
    <div class="bx" id="r2">r2</div>
    <div class="bx" id="s2">s2</div>

    <!-- 두번째 앱솔루트 박스 -->
    <div class="bx" id="a2">a2</div>
    <!-- 
    [ 젠코딩(에밋코딩) ]

    .bx#s${s$}*3 
    ___________________

    . : 클래스
    # : 아이디
    $ : 증가숫자자리
    *숫자 : 반복생성횟수
    {} : 데이터출력(꺽쇠사이값)
    [] : 속성셋팅값
    > : 하위직계 자식요소
    + : 형제요소
    () : 요소 구분하기     
    ______________________
    ((샘플))
    header.my#key[title=hi]{메뉴}*2

    ul>li*3>a*4

    div.my#my$*2>section+article>img
    -->
  </body>
</html>

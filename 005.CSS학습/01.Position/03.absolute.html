<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>03. absolute 포지션</title>
    <style>
      .bx {
        width: 300px;
        height: 300px;
        border: 2px solid blue;
        text-align: center;
        font-size: 24px;
        font-weight: bold; /* fwb */
        /* 글자세로중앙 */
        line-height: 300px;
      }

      /* 첫번째 앱솔루트 박스 */
      #a1 {
        position: absolute;
        /******************************** 
        [ 3. absolute 포지션 ]
        - 절대적인 부모를 기준으로
        위치를 잡는 포지션
        - 부모자격을 따져서 기준을 삼는다!
        (단, 위치속성을 쓴 경우에만!!!)

        1. absolute 포지션은 위치이동값을 쓰기전과
        쓴후로 나눌 수 있다!

          (1) 위치이동값을 쓰지 않은 경우

          - 자기보다 위에 있는 static한 요소를 
          존중하여 그 아래 위치함!!!
          (->>>> 젠틀앱솔루트!!!)

          - 어떤 요소의 자식요소로 앱솔루트가 셋팅된 경우
          그 부모박스에 부모자격이 없을지라도!!!!!!
          그 위치를 그대로 유지한다!
          (->>>> 젠틀앱솔루트!!!)

          + 앱솔루트 요소보다 아랫쪽에 위치하고 있는
          static한 요소는 앱솔루트를 인식하지 못하여
          같은 자리에 올라와 자리를 차지한다!
          (줄서있다가 날아오른 아이언맨!)

          (2) 위치 이동값을 사용한 경우

          - 위치 이동값을 사용한 부분에 대해서만!!!
          앱솔루트가 위치를 잡을때 기준이 되는
          부모는? static이 아닌 요소가 부모다!

          static이 아닌 포지션은?
          relative / absolute / fixed / sticky

          -> 위치 이동값을 쓰지 않는 부분에 대해서는
          부모를 찾지 않는다!!!(젠틀함!!!)

          -> 부모자격이 있는 부모요소들 중 가장 가까운 것이 부모다!

          -> 만약 부모자격이 모두 없으면 보이는 화면
          (window)을 기준한다!
          (보이는 화면은 body가 아니다! 스크롤이
          생겨도 스크롤 위쪽 보이는 화면을 지칭한다!)

          -> 또한!
          width나 height 값을
          %단위로 줄 경우 부모자격을 가진 요소를
          기준으로 그 크기를 잡는다!
          (일반적으로 %단위의 크기는 바로 싸고 있는
          직계부모박스를 기준한다!)

          
      ********************************/

        height: 500px;

        background: url(./images/capma.png) no-repeat center/cover;
      }
      /* 두번째 앱솔루트 박스 
      -> 위치값을 주면 부모를 찾음
      -> 싸고 있는 모든 요소가 부모자격이 없으면
      스크롤 상단 보이는 화면이 부모가 된다!
      */
      #a2 {
        position: absolute;
        width: 650px;
        /* 오른쪽 아래 0 위치 부모는? 보이는 화면 */
        right: 0;
        bottom: 0;

        background: url(./images/superman.png) no-repeat center/cover;
      }

      #r1 {
        /* 포지션 relative : por */
        position: relative;

        /* 위로부터 100px : t100 */
        top: 100px;

        /* 왼쪽으로부터 100px : l100 */
        left: 100px;

        background: url(./images/ab5.jpg) no-repeat center/cover;
      }
      #r2 {
        /* 포지션 relative */

        background: url(./images/ab4.jpg) no-repeat center/cover;
      }

      /* 첫번째 박스에 포지션 체크 */
      #s1 {
        background-color: lightgreen;
      }
      #s2 {
        background-color: lightcoral;
      }

      /* 제목넣기 : 렐러티브로! */
      h1.tit {
        position: relative;
        left: 30%;
        width: 40%;
        text-align: center;
        margin: 0;
        padding: 20px;
        border: 4px solid darkorange;
        border-radius: 20px;
        background-color: lightsalmon;
        box-shadow: 5px 5px 5px #0000006b;
        font-size: 45px;
      }

      /* 부모를 찾는 앱솔루트! */
      .bx2 {
        border: 2px dotted orangered;
        padding: 50px;
        font-size: 24px;
        text-align: center;
      }
      /* 각 부모박스 */
      .s5 {
        position: relative;
        background-color: lightblue;
      }
      .s6 {
        position: relative;
        background-color: lightcoral;
      }
      .s7 {
        position: relative;
        background-color: lightgreen;
      }
      .s8 {
        position: relative;
        background-color: lightsalmon;
      }

      /* 부모를 찾는 앱솔루트 박스 */
      .abs {
        position: absolute;
        width: 100px;
        height: 50px;
        color: #fff;
        background: url(./images/car.png) no-repeat center/contain;
      }

      /* .a4는 위치이동값을 사용하자! -> 부모찾아 삼만리! */
      .a4 {
        /* 앱솔루트는 .abs에서 이미 셋팅! */
        top: 0;
        left: 0;
        /* 나의 부모는? 포지션이 있는 요소! .s8 */

        /* 앱솔루트 요소 크기를 %로 줄경우
            부모자격 박스를 기준하여 설정된다!!! */
        width: 25%;
        height: 40%;

        /* 보더 */
        border: 10px dotted darkblue;
      }

      /* span 을 앱솔루트로 만들경우! */
      .spabs {
        /* 포지션 앱솔루트 poa */
        position: absolute;
        bottom: 0;
        right: 0;
        /* 나의 부모는? .s8 */

        /* 아웃라인 ol */
        outline: 4px dotted darkmagenta;
      }

      /* 앱솔루트 판타롱스타킹~~!
      -> 앱솔루트 박스에 width,height를 주지 않아도
      내용물 만큼 자동으로 크기가 생성된다! */
      .a5 {
        position: absolute;
        top: 20%;
        right: 10%;
        /* 부모는? 보이는화면! */

        /* 아웃라인 */
        outline: 10px ridge goldenrod;
      }

      /* 이미지가 박스에 단독으로 들어갈 경우
      하단에 생기는 공백 없애기 */
      .a5 img {
        vertical-align: middle;
        /* 인라인요소가 세로정렬 속성인 vertical-align의
        값을 top/middle/bottom 중 어떤값을 사용해도
        하단공백을 없애는 효과가 있다!
        (단,baseline값 효과없음) */
      }

      /* 앱솔루트끼리는 서로 겹친다! */
      .absolute-images {
        width: 300px;
        height: 400px;
        /* 보더액자 */
        border: 50px ridge silver;
      }
      /* 이미지가 앱솔루트! */
      .absolute-images img {
        /* 앱솔루트 포지션 poa */
        position: absolute;
        /* 젠틀앱솔루트!!! */

        width: 300px;
        height: 400px;
      }
      /* 두번째 이미지 투명하게 셋팅 */
      .absolute-images img:last-child {
        opacity: 0;
        /* 트랜지션 trs */
        transition: 0.3s;
      }
      /* 싸고있는 박스에 마우스 오버시 투명도1 */      
      .absolute-images:hover img:last-child {
        opacity: 1;
      }

      /* 앱솔루트 위치값으로 크기만들기 */
      .car-box{
        position: absolute;
        /* 맨위 왼쪽에 위치 */
        top: 0;
        left: 0;
        /* 부모는? 보이는화면! */

        /* 가로크기 - 부모의 25% */
        width: 25%;

        /* 보더 */
        border: 4px dashed darkblue;
        border-radius: 20px;
      }

      /* 자동차 이미지 */
      .car-box img{
        width: 100%;
        /* 이미지는 한쪽 크기만 주면
        나머지 방향크기는 자동비율유지함! */
      }

      /* 자동차 앱솔루트 타이틀박스 */
      .car-box h3{
        position: absolute;
        /* 위치값으로 부모가로크기를 채우게함!
        동적크기 생성! */
        left: 0;
        right: 0;

        bottom: 0;
        /* 부모는? .car-box */
        border: 1px solid red;

        /* 글자중앙정렬 tac */
        text-align: center;

        /* 기본마진없애기 */
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- 제목 -->
    <h1 class="tit">Absolute 포지션</h1>

    <div class="bx" id="r1">r1</div>
    <div class="bx" id="s1">s1</div>

    <!-- 첫번째 앱솔루트 박스 -->
    <div class="bx" id="a1">a1</div>

    <div class="bx" id="r2">r2</div>
    <div class="bx" id="s2">s2</div>

    <!-- 두번째 앱솔루트 박스 -->
    <div class="bx" id="a2">a2</div>

    <!-- 앱솔루트 판타롱스타킹~~! -->
    <div class="a5" title="앱솔루트 판타롱스타킹~~!">
      <img src="./images/ab0.jpg" alt="포스터" />
    </div>

    <!-- 앱솔루트끼리는 서로 겹친다! -->
    <div class="absolute-images">
      <img src="./images/ab3.jpg" alt="토르" />
      <img src="./images/ab4.jpg" alt="닥스" />
    </div>

    <!-- 앱솔루트 위치값으로 크기만들기 -->
     <div class="car-box">
      <img src="./images/car.png" alt="자동차">
      <!-- 위치값으로 크기만들 타이틀박스 -->
       <h3>😎레드 스포츠카!!!🚗</h3>
     </div>

    <!-- 부모를 찾는 앱솔루트! -->
    <div class="bx2 s5">
      s5
      <div class="bx2 s6">
        s6
        <div class="bx2 s7">
          s7
          <div class="bx2 s8">
            s8
            <!-- 박스내부 앱솔루트 -->
            <div class="abs a3" title="나는 젠틀앱솔루트다!">a3</div>

            <div class="abs a4" title="나는 부모찾아 올라간다!">a4</div>

            <span class="spabs" title="자동블록전환!">
              나는 span앱솔루트다!
            </span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

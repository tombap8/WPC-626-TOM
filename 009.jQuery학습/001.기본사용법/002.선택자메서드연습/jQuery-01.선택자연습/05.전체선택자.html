<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>전체 선택자 (*)</title>
    <!-- jQuery library -->
    <script src="../jquery-3.6.3.min.js"></script>
    <style>
      body {
        font-size: 4vw;
      }
    </style>
    <script>
      $(() => {
        //////// jQB ///////////////////
        // 미션: body를 클릭하면 모든 요소를 선택하여(*)
        // 인터넷으로 검색한 이미지 주소를 배경이미지로 설정하여 width: 500px, height: 700px 로 설정하시오.
        
        $("body").click(() => {
          $("*").css({
            backgroundImage:
              "url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1170&q=80')",
            width: "500px",
            height: "700px",
            backgroundSize: "cover",
            backgroundPosition: "center",
            color: "white",
            transition: "all 1s ease-in-out"
          });
        });
      }); //////////// jQB ///////////////////
    </script>
  </head>

  <body>
    <div id="container">
      <header>
        <h2>아무데나 클릭하시오!</h2>
      </header>

      <nav>
        <ul class="list">
          <li id="first">One</li>
          <li id="second">Two</li>
          <li id="third">Three</li>
        </ul>
      </nav>
    </div>

    <!---------- jQuery code Start ---------->
    <script></script>
  </body>
</html>

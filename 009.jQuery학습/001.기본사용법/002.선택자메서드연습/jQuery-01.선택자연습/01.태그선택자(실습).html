<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>태그 선택자</title>
    <!-- jQuery library 가장위에 있어야함!!! -->
    <script src="../jquery-3.6.3.min.js"></script>
    <script>
      // 제이쿼리 함수명은? $
      // 공식적인 제이쿼리 함수이름은 jQuery
      // $(()=>{}) : 제이쿼리로딩구역

      $(()=>{ // 아래쪽 html이 모두 로딩되면 본구역실행!
        // [ 제이쿼리 사용법1 ]
        // 1. 요소 선택법 : $(선택자)
        // 2. 메서드 사용법 : $(선택자).메서드()
        // (1) 클릭하면 메서드는? click(함수)
        // (2) css변경 메서드는? css(속성명,값)
        // -> 여러개의 속성을 셋팅하려면?
        // css({속성명1:값1,속성명2:값2})
        // 단, 속성명은 문자형/변수형 모두 가능함!
        // 그러나 객체가 아닌 하나만 쓰면 CSS에서는
        // 속성을 반드시 문자로만 써야함!


        $('h2').click(()=>{
          // #container 배경색 변경하라! pink색으로!
          $('#container').css('background-color','pink');

          // 미션: body를 선택하여
          // 배경색은 #ccc, 글자크기는 5vw
          // 트랜지션은 2s 로 설정하시오.
          $('body').css({
            backgroundColor:'#ccc',
            fontSize:'5vw',
            transition:'2s'
          });


          // $('body').css({
          //   'background-color':'#ccc',
          //   'font-size':'5vw',
          //   'transition':'2s'
          // });

        }); /// click ///

      }); /// jQuery //////////////
    </script>
  </head>

  <body>
    <div id="container">
      <header>
        <h2>여기를 클릭하시오~!!!</h2>
      </header>

      <nav>
        <ul class="list">
          <li id="first"><span>One</span></li>
          <li id="second"><span>Two</span></li>
          <li id="third"><span>Three</span></li>
        </ul>
      </nav>
    </div>

    <!---------- jQuery code Start ---------->
    <script></script>
  </body>
</html>

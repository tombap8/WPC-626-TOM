<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>53. load 메서드</title>
    <style>
        body{
            font-size: 4vw;
        }
    </style>
    <!-- 제이쿼리 라이브러리 -->
    <script src="../jquery-3.6.3.min.js"></script>
    <!-- JS코드구역 -->
    <script>
        $(()=>{
            // 제이쿼리 load() 메서드 ///
            // 기존 파일을 불러와서 특정
            // 요소에 넣을 수 있다!
            // - 형식 : $(선택자).load(파일경로)
            // - 불러올 수 있는 파일형식 : html, txt, inc 등
            // -> 단, html형식이 아니면 코딩시 자동완성지원 불가!
            // - inc형식은 text파일 형식과 유사함
            // (부분소스파일로 많이 쓰임)

            $('.header-section').load('./inc/header.html');
            $('.footer-section').load('./inc/footer.html');
            // 텍스트형식 문서도 불러올 수 있다!
            $('.add-section').load('./inc/add.txt');
        }); ///////// 로드구역 ///////////

    </script>
</head>
<body>
    <!-- 헤더 들어갈 태그 -->
     <div class="header-section"></div>
     <!-- 메인 영역 -->
    <main>나는 메인이야!</main>
    <!-- 푸터 들어갈 태그 -->
     <div class="footer-section"></div>
     <!-- 추가 불러오기 -->
     <div class="add-section"></div>
    
</body>
</html>

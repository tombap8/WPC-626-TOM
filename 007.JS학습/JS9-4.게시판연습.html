<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS9-4.게시판연습</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .tit {
        text-align: center;
        font-size: 5vh;
      }
      .wrap {
        max-width: 1000px;
        min-height: 100vh;
        display: flex;
        margin: 0 auto;
      }
      .wrap > div {
        flex: 1;
        box-sizing: border-box;
        border: 4px double darkblue;
        text-align: center;
      }
      .imgbx {
        max-width: 235px;
        aspect-ratio: 235/381;
        margin: 0 auto;
      }
      .imgbx img {
        object-fit: cover;
        width: 100%;
        height: 100%;
        object-position: left;
      }
      .imgbx.ib2 img {
        object-position: right;
      }

      table {
        max-width: 1000px;
        margin: 20px auto;
        border-collapse: collapse;
        border-bottom: 1px solid #000;
      }
      table th {
        border-top: 1px solid #000;
        border-bottom: 1px solid #000;
        padding: 7px 0;
      }
      table td {
        padding: 20px;
        text-align: center;
      }

      table tr:nth-child(odd) td {
        background-color: #ccc;
      }

      /* 입력창 공통 스타일 */
      .inbx {
        max-width: 900px;
        margin: 1vh auto;
        text-align: center;
        border: 1px solid #000;
      }
      /* 모든 글자 크기 변경 */
      body * {
        font-size: 3vh;
      }
      li {
        padding: 1vh;
        text-align: center;
        list-style: none;
      }

      /* 입력버튼 박스 초기셋팅 */
      .btn-box .modify-box {
        display: none;
      }
      /* 입력버튼 박스에 클래스 on을 쓸경우 
      수정버튼박스가 보임 */
      .btn-box.on .modify-box {
        display: block;
      }
      .btn-box.on .input-box {
        display: none;
      }
    </style>

    <!-- 게시판연습 JS -->
    <script type="module" src="./js/js9-3.board_test.js"></script>
  </head>
  <body>
    <h1 class="tit">== 게시판 연습 ==</h1>

    <!-- 리스트 출력박스 -->
    <div class="board"></div>

    <!-- 입력창박스 -->
    <div class="inbx">
      <!-- <form action="" method="post"> -->
      <ul>
        <li>
          <!-- 수정시 idx항목을 히든필드에 저장함 -->
          <input type="hidden" id="hidden-idx" />
          <label for="tit">제목</label>
          <input type="text" id="tit" />
        </li>
        <li>
          <label for="cont">내용</label>
          <input type="text" id="cont" />
        </li>
        <li class="btn-box">
          <div class="input-box">
            <input type="submit" value="입력" id="sbtn" />
          </div>
          <div class="modify-box">
            <input type="submit" value="수정" id="update-btn" />
            <input type="submit" value="취소" id="cancel-btn" />
          </div>
        </li>
      </ul>
      <!-- </form> -->
    </div>
  </body>
</html>

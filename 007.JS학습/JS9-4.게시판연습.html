<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS9-4.게시판연습</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .tit {
        text-align: center;
        font-size: 5vh;
      }
      .wrap {
        max-width: 1000px;
        min-height: 100vh;
        display: flex;
        margin: 0 auto;
      }
      .wrap > div {
        flex: 1;
        box-sizing: border-box;
        border: 4px double darkblue;
        text-align: center;
      }
      .imgbx {
        max-width: 235px;
        aspect-ratio: 235/381;
        margin: 0 auto;
      }
      .imgbx img {
        object-fit: cover;
        width: 100%;
        height: 100%;
        object-position: left;
      }
      .imgbx.ib2 img {
        object-position: right;
      }

      table {
        max-width: 1000px;
        margin: 20px auto;
        border-collapse: collapse;
        border-bottom: 1px solid #000;
      }
      table th {
        border-top: 1px solid #000;
        border-bottom: 1px solid #000;
        padding: 7px 0;
      }
      table td {
        padding: 20px;
        text-align: center;
      }

      table tr:nth-child(odd) td {
        background-color: #ccc;
      }

      /* 수정창, 입력창 공통 스타일 */
      .mobx, .inbx {
        max-width: 900px;
        margin: 1vh auto;
        text-align: center;
        border: 1px solid #000;
      }
      /* 모든 글자 크기 변경 */
      body * {
        font-size: 3vh;
      }
      li{
        padding: 1vh;
        text-align: center;
        list-style: none;
      }

      @media screen and (max-width: 900px) {
        .session {
          display: none;
        }
      }
    </style>

    <!-- 게시판연습 JS -->
    <script type="module" src="./js/js9-3.board_test.js"></script>
  </head>
  <body>
    <h1 class="tit">== 게시판 연습 ==</h1>

    <!-- 리스트 출력박스 -->
    <div class="board"></div>

    <!-- 입력창박스 -->
    <div class="inbx">
      <!-- <form action="" method="post"> -->
      <ul>
        <li>
          <label for="tit">제목</label>
          <input type="text" id="tit" />
        </li>
        <li>
          <label for="cont">내용</label>
          <input type="text" id="cont" />
        </li>
        <li>
          <input type="submit" value="입력" id="sbtn" />
        </li>
      </ul>
      <!-- </form> -->
    </div>

    <!-- 수정창박스 -->
    <div class="mobx">
      <h2>수정할 항목을 선택하세요!</h2>
      <div class="mosel">
        <select name="sel" id="sel">
          <option value="show">항목선택</option>
        </select>
      </div>
      <!-- <form action="" method="post"> -->
      <ul>
        <li>
          <label for="tit">제목</label>
          <input type="text" id="tit2" />
        </li>
        <li>
          <label for="cont">내용</label>
          <input type="text" id="cont2" />
        </li>
        <li>
          <input type="submit" value="수정" id="mobtn" />
        </li>
      </ul>
      <!-- </form> -->
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 폰트어썸 CDN CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <!-- 메인 미디어쿼리 CSS -->
    <link rel="stylesheet" href="./css/main_media.css" />

    <!-- 매거진 리스트 CSS -->
    <link rel="stylesheet" href="./css/magazine_detail.css" />

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Common JS (공통 모듈 로드) -->
    <script src="./js/common.js" type="module"></script>

    <!-- 매거진 리스트 데이터 바인딩 JS -->
    <script type="module" src="./js/magazine_detail.js"></script>

    <title>VOGUE 정기구독 상세페이지</title>
  </head>
  <body>
    <!-- ========== 헤더 영역 (공통 모듈) ========== -->
    <div id="header-area"></div>

    <!-- ========== 메인 컨텐츠 ========== -->
    <main class="main-area inbox">
      <div class="product-section">
        <!-- 이미지 영역 -->
        <div class="image-area">
          <div class="main-image">
            <img
              src="https://godomall.speedycdn.net/135d464bb6e6ef46c78bf30c67f818d1/goods/1000000297/image/detail/1000000297_detail_075.png"
              alt="보그 1년 정기구독"
            />
          </div>
          <div class="thumb-list">
            <div class="thumb-item active">
              <img
                src="https://godomall.speedycdn.net/135d464bb6e6ef46c78bf30c67f818d1/goods/1000000297/image/detail/thumb/1000000297_detail_075.png"
                alt="보그 썸네일"
              />
            </div>
          </div>
        </div>
        <!-- 정보 영역 -->
        <div class="info-area">
          <div class="title-section">
            <h1 class="product-title">보그 1년 정기구독</h1>
            <button class="share-btn">공유</button>
          </div>
          <div class="info-list">
            <div class="info-row">
              <div class="info-label">짧은설명</div>
              <div class="info-value">보그 정기구독시 25% 할인 혜택!!</div>
            </div>
            <div class="info-row">
              <div class="info-label">정가</div>
              <div class="info-value">
                <del>96,000원</del>
              </div>
            </div>
            <div class="info-row price-row">
              <div class="info-label">판매가</div>
              <div class="info-value">72,000원</div>
            </div>
            <div class="info-row">
              <div class="info-label">구매제한</div>
              <div class="info-value">최소 1개</div>
            </div>
            <div class="info-row">
              <div class="info-label">배송비</div>
              <div class="info-value">
                <span class="delivery-badge">무료</span>
                <span>택배</span>
              </div>
            </div>
            <div class="info-row">
              <div class="info-label">상품코드</div>
              <div class="info-value">1000000297</div>
            </div>
            <div class="info-row">
              <div class="info-label">신간발행일</div>
              <div class="info-value">매월18~20일</div>
            </div>
            <div class="info-row">
              <div class="info-label">상품재고</div>
              <div class="info-value">81개</div>
            </div>
          </div>
          <div class="select-area">
            <div class="info-label" style="margin-bottom: 8px">시작 월</div>
            <select class="select-box">
              <option>2025-11월호 부터</option>
            </select>
          </div>
          <div class="selected-item">
            <div class="item-header">
              <div class="item-name">보그 1년 정기구독</div>
            </div>
            <div class="item-controls">
              <div class="quantity-control">
                <button type="button" onclick="decreaseQty()">-</button>
                <input type="text" id="quantity" value="1" readonly />
                <button type="button" onclick="increaseQty()">+</button>
              </div>
              <div class="item-price"><span id="itemPrice">72,000</span>원</div>
            </div>
          </div>
          <div class="price-summary">
            <div class="summary-row">
              <span>총 상품금액</span>
              <span id="totalPrice">72,000원</span>
            </div>
            <div class="summary-row total">
              <span>총 합계금액</span>
              <span class="amount" id="finalPrice">72,000원</span>
            </div>
          </div>
          <div class="button-group">
            <button class="btn btn-cart">장바구니</button>
            <button class="btn btn-wish">찜하기</button>
          </div>
          <div class="button-group">
            <button class="btn btn-buy">바로 구매</button>
          </div>
        </div>
      </div>
    </main>
    <!-- ========== 푸터 영역 (공통 모듈) ========== -->
    <div id="footer-area"></div>
  </body>
</html>

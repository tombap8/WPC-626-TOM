<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <!-- 메인 미디어쿼리 CSS -->
    <link rel="stylesheet" href="./css/main_media.css" />

    
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Common JS (공통 모듈 로드) -->
    <script src="./js/common.js" type="module"></script>
    <title>VOGUE 정기구독</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            color: #333;
        }

        /* 배너 섹션 */
        .banner {
            width: 100%;
            height: 400px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 컨테이너 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 상품 리스트 헤더 */
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .product-header h2 {
            font-size: 24px;
            font-weight: 500;
        }

        .more-btn {
            padding: 8px 20px;
            background: #fff;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s;
        }

        .more-btn:hover {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        /* 상품 그리드 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        /* 상품 카드 */
        .product-card {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            overflow: hidden;
            background: #f9f9f9;
            margin-bottom: 15px;
        }

        .product-image img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e31837;
            color: #fff;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1;
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 11px;
            z-index: 1;
        }

        .product-info {
            padding: 0 5px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }

        .product-desc {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .original-price {
            text-decoration: line-through;
            color: #999;
            font-size: 14px;
        }

        .sale-price {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .member-only {
            font-size: 14px;
            color: #666;
        }

        /* 태블릿 (1024px 이하) */
        @media (max-width: 1024px) {
            .container {
                max-width: 100%;
                padding: 0 30px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }

            .banner {
                height: 300px;
            }

            .product-header h2 {
                font-size: 22px;
            }
        }

        /* 모바일 (819px 이하) */
        @media (max-width: 819px) {
            .container {
                padding: 0 15px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .banner {
                height: 200px;
                margin-bottom: 30px;
            }

            .product-header {
                margin-bottom: 20px;
            }

            .product-header h2 {
                font-size: 18px;
            }

            .more-btn {
                font-size: 12px;
                padding: 6px 15px;
            }

            .product-name {
                font-size: 14px;
            }

            .product-desc {
                font-size: 12px;
            }

            .original-price {
                font-size: 12px;
            }

            .sale-price {
                font-size: 16px;
            }

            .discount-badge {
                font-size: 12px;
                padding: 4px 8px;
            }
        }
    </style>
</head>

        // 숫자를 원화 형식으로 변환
        function formatPrice(price) {
            return price.toLocaleString('ko-KR') + '원';
        }

        // 상품 카드 HTML 생성 함수
        function createProductCard(product) {
            const badgeHTML = product.badge ? `<span class="badge">${product.badge}</span>` : '';
            
            const priceHTML = product.memberOnly 
                ? `<p class="member-only">이 제품은 회원가입후 구매가 가능합니다.</p>`
                : `<span class="sale-price">${formatPrice(product.salePrice)}</span>`;

            return `
                <div class="product-card">
                    <div class="product-image">
                        <span class="discount-badge">${product.discount}</span>
                        ${badgeHTML}
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-desc">${product.description}</p>
                        <div class="price-box">
                            <span class="original-price">${formatPrice(product.originalPrice)}</span>
                            ${priceHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // 상품 렌더링 함수
        function renderProducts() {
            const productGrid = document.getElementById('productGrid');
            const productsHTML = productsData.products.map(product => createProductCard(product)).join('');
            productGrid.innerHTML = productsHTML;
        }

        // 페이지 로드 시 상품 렌더링
        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
</body>
</html>

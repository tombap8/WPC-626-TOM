<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쓸쓸하고 찬란하神 도깨비 드라마 소개</title>
    <!-- 파비콘 넣기 -->
    <link rel="shortcut icon" href="./images/favi_new.png" />
    <!-- 폰트어썸 CDN CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />
    <!-- 스와이퍼 CDN CSS -->
    <link rel="stylesheet" href="./css/swiper-bundle.min.css" />
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <!-- 미디어쿼리는 반드시 일반css아래 위치함! -->
    <link rel="stylesheet" href="./css/media_main.css" />

    <!-- 스와이퍼 JS -->
    <script src="./js/swiper-bundle.min.js"></script>

    <!-- 제이쿼리 라이브러리 불러오기 
     제이쿼리를 사용하는 JS파일 위에 불러와야한다! -->
    <script src="./js/jquery-3.6.3.min.js"></script>

    <!-- 외부JS 제이쿼리버전 - defer필수! -->
    <!-- <script src="./js/main1_jquery.js" defer></script> -->

    <!-- 공통 JS : import 문법을 사용하려면
     반드시 type='module'을 써야한다! -->
    <script type="module" src="./js/common.js"></script>
    <!--  메인 JS : 모듈사용! -->
    <script src="./js/main.js" type="module"></script>
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area"></div>
    <!-- #top-area -->

    <!-- 2. 메인영역 -->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1. 배너영역 -->
        <section class="banner-part"></section>

        <!-- 2-2. 캐릭터영역 -->
        <section class="cat-part inbox">
          <h2 class="temp-tit blind">2-2. 캐릭터영역</h2>
          <!-- 캐릭터 박스 -->
          <article class="cat-box"></article>
        </section>
        
        <!-- 2-2.5. 드라마파트메뉴 : 스티키메뉴 -->
        <div id="spart-menu"></div>

        <!-- 2-3. 드라마소개영역 -->
        <section id="intro-part" class="intro-part inbox set-it1 scroll-act">
          <h2 class="temp-tit blind">2-3. 드라마소개영역</h2>
          <div class="cont-box">
            <!-- 3-1.드라마 요약정보 파트 -->
            <div class="col-6 col-2nd-12">
              <!-- 드라마소개파트 제목 -->
              <h2 class="stit">도깨비</h2>
              <!-- 하위제목+아이콘 -->
              <div class="intro-desc">
                <h3>[종영] 2016.12.02 ~ 2017.01.21</h3>
                <ul>
                  <li>
                    <a href="#" class="fa-brands fa-instagram">
                      <span class="ir"> 인스타그램 </span>
                    </a>
                  </li>
                  <li>
                    <a href="#" class="fa-brands fa-facebook">
                      <span class="ir"> 페이스북 </span>
                    </a>
                  </li>
                  <li>
                    <a href="#" class="fa-brands fa-twitter">
                      <span class="ir"> 트위터 </span>
                    </a>
                  </li>
                  <li>
                    <a href="#" class="fa-brands fa-youtube">
                      <span class="ir"> 유튜브 </span>
                    </a>
                  </li>
                  <li>
                    <a href="#" class="fa-solid fa-play">
                      <span class="ir"> 네이버 TV </span>
                    </a>
                  </li>
                </ul>
              </div>
              <!-- 설명박스 -->
              <p class="intro-txt">
                불멸의 삶을 끝내기 위해 인간 신부가 필요한 도깨비, 그와 기묘한
                동거를 시작한 기억상실증 저승사자. 그런 그들 앞에 '도깨비
                신부'라 주장하는 '죽었어야 할 운명'의 소녀가 나타나며 벌어지는
                神비로운 낭만 설화.
              </p>
              <!-- 인트로 버튼 -->
              <button class="intro-btn">방송편성보기</button>
            </div>

            <!-- 3-2.인트로 동영상 파트 -->
            <div class="col-6 col-2nd-12">
              <figure class="intro-mv-box">
                <div class="intro-mv-img off">
                  <img
                    src="./images/intro_mv_img.jpg"
                    alt="인트로 동영상 이미지"
                  />
                </div>
                <figcaption>
                  [예고]끝나지 않은 깨요일! 공동재부터 깨비.저승 커플 키스신
                  비하인드까지! #하드털이 #스페셜
                </figcaption>
              </figure>
            </div>
          </div>
        </section>

        <!-- 2-4. 미리보기영역 -->
        <section id="preview-area" class="preview-area inbox set-it1 scroll-act">
          <h2 class="stit">미리보기</h2>
          <div>
            <ul class="cont-box"></ul>
          </div>
        </section>

        <!-- 2-5. 현장포토영역 -->
        <section id="real-part" class="real-part inbox set-it1 scroll-act">
          <h2 class="stit">현장포토</h2>
          <div class="cont-box">
            <div class="col-12 live-box"></div>
          </div>
        </section>

        <!-- 2-6. 대표포스터영역 -->
        <section id="poster-part" class="poster-part inbox set-it1 scroll-act">
          <h2 class="stit">대표포스터</h2>
          <div class="cont-box">
            <div class="col-12 poster-box"></div>
          </div>
        </section>

        <!-- 2-7. 최신동영상영역 -->
        <section id="video-part" class="video-part inbox set-it1 scroll-act">
          <h2 class="stit">최신 동영상</h2>
          <div class="cont-box">
            <!--******************************************* 
            스와이퍼는 3중 박스 구조를 가진다!
            .clip-box(부모박스 이름은 자유!)
              ㄴ.swiper-wrapper(클래스명고정!)
                ㄴ.swiper-slide(클래스명고정!)
            *******************************************-->
            <!-- 스와이퍼 적용 부모박스 : .clip-box -->
            <div class="clip-box col-12"></div>
            <!-- 이동버튼박스 -->
            <div class="btn-box">
              <button class="abtn ab1 fa-solid fa-chevron-left"></button>
              <button class="abtn ab2 fa-solid fa-chevron-right"></button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <!-- 3. 하단영역 -->
    <div id="bottom-area"></div>
  </body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Demo styles -->
  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }

    body {
      background: #000;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      text-align: center;
      font-size: 18px;
      background: #444;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <img src="./images/banner/ban01.jpg" alt="배너1">
      </div>
      <div class="swiper-slide">
        <img src="./images/banner/ban02.jpg" alt="배너2">
      </div>
      <div class="swiper-slide">
        <img src="./images/banner/ban03.jpg" alt="배너3">
      </div>
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Initialize Swiper -->
  <script>
    /* JS의 스와이퍼 인스턴스 객체 생성하기! */
     var swiper = new Swiper(".mySwiper", {
      slidesPerView: 1,
    //   spaceBetween: 30,
      loop: true,
      // 블릿 셋팅
      pagination: {
        el: ".swiper-pagination",
        /* 블릿클릭 작동여부 */
        clickable: true,
      },
      // 양쪽이동버튼 셋팅
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
      // 자동플레이설정
      autoplay: {
        delay: 2500, // 지연시간
        disableOnInteraction: false, 
        // 건드리면 멈췄다가 다시 재개함!(false)
      },
    });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGV에 오신것을 환영합니다!</title>
    <!-- 폰트어썸 아이콘 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <!-- 미디어쿼리 CSS : 
     덮어쓸 수 있게 메인 CSS 아래쪽에 위치해야함! -->
    <link rel="stylesheet" href="./css/media.css" />
    

    <!-- 추가 기능 JS 외부파일
     defer속성은 html태그 로딩후 실행함! -->
     <script src="./js/main.js" defer></script>
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox"></header>
    </div>
    <!-- 2. 메인영역 -->
    <div id="main-area">
      <main class="main-area inbox">
        <!-- 2-1. 스크린박스 -->
         <div class="screen">
          <!-- 유튜브 아이프레임 -->
           <iframe src="https://www.youtube.com/embed/8p1VNDiI4WM?autoplay=1&mute=1&loop=1&playlist=8p1VNDiI4WM" allow="autoplay"></iframe>
         </div>
         <!-- 2-2. 메뉴 박스 -->
          <nav class="poster-menu-box">
            <ul>
              <li>
                <a href="#">
                  <img src="./images/m1.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>어쩔수가없다</h2>
                    <h3>이병헌, 손예진</h3>
                    <h4>스릴러, 코미디</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m2.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>귀멸의 칼날: 무한성편</h2>
                    <h3>소토자키 하루오</h3>
                    <h4>애니메이션</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m3.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>얼굴</h2>
                    <h3>박정민, 권해효</h3>
                    <h4>미스터리</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m4.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>모노노케 히메</h2>
                    <h3>미야자키 하야오</h3>
                    <h4>애니메이션</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m5.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>F1 더 무비</h2>
                    <h3>브래드 피트</h3>
                    <h4>드라마, 액션</h4>
                   </hgroup>
                </a>
              </li>
              <li>
                <a href="#">
                  <img src="./images/m6.jpg" alt="영화명">
                  <!-- 영화개요박스 -->
                   <hgroup class="movie-info">
                    <h2>보스</h2>
                    <h3>조우진, 정경호</h3>
                    <h4>코미디, 액션</h4>
                   </hgroup>
                </a>
              </li>
            </ul>
          </nav>
      </main>
    </div>
    
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
    
  </body>
</html>
